name: Pin audit

# Verifies every third-party action used in scp.yml + other workflows is pinned
# to a 40-character commit SHA (FR-4). Fails on any unpinned `uses:` outside
# the always-allowed `actions/*` + `github/*` namespaces, plus any first-party
# namespaces listed in the repository variable ALLOWED_ORG_NAMESPACES
# (comma-separated, default: "konecta"). A documented exemption applies to
# slsa-framework/slsa-github-generator/.github/workflows/*.yml (a reusable
# workflow that GitHub resolves by ref-tag-then-SHA at runtime).
#
# To customise: set repo variable ALLOWED_ORG_NAMESPACES, e.g.
#   konecta,konecta-ix,konecta-finance

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: pin-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Audit pins
        env:
          # Repo-level allowlist of first-party org namespaces exempt from
          # SHA-pinning. Comma-separated; defaults to `konecta` when unset so
          # any Konecta team can fork without configuration.
          ALLOWED_ORG_NAMESPACES: ${{ vars.ALLOWED_ORG_NAMESPACES }}
        run: |
          set -euo pipefail
          fail=0
          # Always-allowed namespaces (GitHub-maintained tooling).
          base_allow='actions|github'
          # User-configurable namespaces from repo variable.
          custom="${ALLOWED_ORG_NAMESPACES:-konecta}"
          # Normalise: strip spaces, replace commas with '|'.
          custom_alt="$(printf '%s' "$custom" | tr -d ' ' | tr ',' '|')"
          allow_re="^(${base_allow}|${custom_alt})/"
          echo "::notice::pin-audit allow-list: ${base_allow}, ${custom_alt} (plus slsa-framework tagged refs)"
          # Reusable workflows from the SLSA framework must be ref'd by tag for
          # GitHub's reusable-workflow resolver to honour the trusted-builder check.
          slsa_re='^slsa-framework/slsa-github-generator/'
          while read -r file; do
            while IFS= read -r line; do
              # Strip leading whitespace + 'uses:'.
              ref="$(printf '%s' "$line" | sed -E 's/.*uses:[[:space:]]*//' | awk '{print $1}')"
              [[ -z "$ref" ]] && continue
              # Skip local same-repo references (./...) — they're pinned by
              # construction to the current commit.
              if [[ "$ref" == ./* || "$ref" == .github/* ]]; then
                continue
              fi
              # ref must contain '@'.
              if [[ "$ref" != *@* ]]; then
                echo "::error file=$file::Action '$ref' is missing an @version"
                fail=1
                continue
              fi
              name="${ref%@*}"
              ver="${ref##*@}"
              # Skip allow-listed namespaces.
              if [[ "$name" =~ $allow_re ]]; then
                continue
              fi
              # Reusable SLSA workflow exemption (must use tag).
              if [[ "$name" =~ $slsa_re ]]; then
                if [[ "$ver" =~ ^v[0-9]+(\.[0-9]+(\.[0-9]+)?)?$ ]]; then
                  continue
                fi
                echo "::error file=$file::SLSA reusable workflow '$name' must be tagged (got '$ver')"
                fail=1
                continue
              fi
              # Everyone else: 40-char hex SHA only.
              if ! [[ "$ver" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error file=$file::Action '$name' is not SHA-pinned (got '$ver')"
                fail=1
              fi
            done < <(grep -E '^[[:space:]]*uses:' "$file" || true)
          done < <(find .github/workflows examples -name '*.yml' -type f)
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::Pin audit failed. Update unpinned actions to a 40-char commit SHA."
            exit 1
          fi
          echo "::notice::Pin audit passed."
